<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>ブロック崩し（タッチ対応）</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #070812;
        --panel: rgba(255, 255, 255, 0.08);
        --text: rgba(255, 255, 255, 0.92);
        --muted: rgba(255, 255, 255, 0.7);
        --accent: #67d0ff;
      }

      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }

      html,
      body {
        height: 100%;
        margin: 0;
        background: radial-gradient(1200px 800px at 50% -10%, #18244a 0%, var(--bg) 55%, #04040a 100%);
        color: var(--text);
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", "Segoe UI",
          sans-serif;
        overflow: hidden;
        touch-action: none;
      }

      #wrap {
        position: fixed;
        inset: 0;
        padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom)
          env(safe-area-inset-left);
        display: grid;
        grid-template-rows: auto 1fr;
        gap: 8px;
      }

      header {
        display: grid;
        grid-template-rows: auto auto;
        gap: 8px;
        padding: 10px 12px 10px;
        margin: 0 10px;
        border-radius: 14px;
        background: var(--panel);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        user-select: none;
      }

      header {
        margin-top: 10px;
      }

      .hud {
        display: grid;
        grid-template-columns: 1fr 1fr 1fr;
        gap: 8px;
        font-variant-numeric: tabular-nums;
      }

      .hud b {
        color: white;
      }

      .btns {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }

      button {
        appearance: none;
        border: 1px solid rgba(255, 255, 255, 0.16);
        background: rgba(255, 255, 255, 0.06);
        color: var(--text);
        padding: 8px 10px;
        border-radius: 12px;
        font-weight: 600;
        letter-spacing: 0.02em;
        cursor: pointer;
        user-select: none;
        line-height: 1;
      }

      button:active {
        transform: translateY(1px);
      }

      #stage {
        position: relative;
        margin: 0 10px;
        border-radius: 16px;
        overflow: hidden;
        background: linear-gradient(180deg, rgba(255, 255, 255, 0.07), rgba(255, 255, 255, 0.02));
        border: 1px solid rgba(255, 255, 255, 0.12);
      }

      canvas {
        width: 100%;
        height: 100%;
        display: block;
      }

      #overlay {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        pointer-events: none;
      }

      #card {
        width: min(520px, 92%);
        padding: 16px 16px 14px;
        border-radius: 16px;
        background: rgba(0, 0, 0, 0.45);
        border: 1px solid rgba(255, 255, 255, 0.18);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
      }

      #title {
        font-size: 18px;
        font-weight: 800;
        margin: 0 0 6px;
      }

      #desc {
        margin: 0;
        color: var(--muted);
        line-height: 1.45;
        font-size: 13px;
      }

      #desc code {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
        color: white;
      }
    </style>
  </head>
  <body>
    <div id="wrap">
      <header>
        <div class="hud">
          <div>スコア: <b id="score">0</b></div>
          <div>残機: <b id="lives">3</b></div>
          <div>レベル: <b id="level">1</b></div>
        </div>
        <div class="btns" aria-label="操作">
          <button id="btnStart" type="button">開始 / リリース</button>
          <button id="btnPause" type="button">一時停止</button>
          <button id="btnReset" type="button">リセット</button>
        </div>
      </header>

      <main id="stage">
        <canvas id="c" aria-label="ブロック崩しキャンバス"></canvas>
        <div id="overlay" aria-hidden="true">
          <div id="card">
            <p id="title">ブロック崩し</p>
            <p id="desc">
              画面をドラッグしてパドル操作。<br />
              <code>タップ</code>で開始・ボールのリリース、<code>二本指タップ</code>で一時停止。<br />
              ブロックを全部壊すと次のレベルへ。
            </p>
          </div>
        </div>
      </main>
    </div>

    <script>
      (() => {
        "use strict";

        const canvas = document.getElementById("c");
        const ctx = canvas.getContext("2d", { alpha: true, desynchronized: true });
        const stage = document.getElementById("stage");
        const overlay = document.getElementById("overlay");

        const scoreEl = document.getElementById("score");
        const livesEl = document.getElementById("lives");
        const levelEl = document.getElementById("level");

        const btnStart = document.getElementById("btnStart");
        const btnPause = document.getElementById("btnPause");
        const btnReset = document.getElementById("btnReset");

        const DPR_MAX = 2.5;

        const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
        const rand = (a, b) => a + Math.random() * (b - a);

        const state = {
          running: false,
          paused: false,
          awaitingRelease: true,
          score: 0,
          lives: 3,
          level: 1,
          lastTs: 0,
          activePointerId: null,
          pointerDown: false,
          pointerX: 0,
          pointerDownX: 0,
          pointerDownY: 0,
          pointerDownAt: 0,
          pointerMoved: false,
          pointerStartedInTouchZone: false,
          twoFingerTapArmed: false,
        };

        const world = {
          w: 1,
          h: 1,
          scale: 1,
          touchZoneH: 0,
        };

        const paddle = {
          x: 0,
          y: 0,
          w: 120,
          h: 14,
          rx: 10,
          targetX: 0,
          speed: 28,
        };

        const ball = {
          x: 0,
          y: 0,
          r: 8,
          vx: 0,
          vy: 0,
          baseSpeed: 520,
          stuck: true,
          spin: 0,
        };

        const powerups = {
          // Active effects
          expandUntil: 0,
          slowUntil: 0,
          multiballUntil: 0,
          // Falling items
          drops: [],
          // Runtime
          originalPaddleW: 120,
        };

        const balls = [
          {
            x: 0,
            y: 0,
            r: 8,
            vx: 0,
            vy: 0,
            baseSpeed: 520,
            stuck: true,
            spin: 0,
            active: true,
          },
        ];

        const bricks = {
          cols: 9,
          rows: 6,
          gap: 8,
          top: 70,
          height: 20,
          paddingX: 18,
          paddingY: 16,
          items: [],
        };

        function resize() {
          const rect = stage.getBoundingClientRect();
          const dpr = Math.min(DPR_MAX, window.devicePixelRatio || 1);
          canvas.width = Math.max(1, Math.floor(rect.width * dpr));
          canvas.height = Math.max(1, Math.floor(rect.height * dpr));
          canvas.style.width = `${rect.width}px`;
          canvas.style.height = `${rect.height}px`;
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
          world.w = rect.width;
          world.h = rect.height;
          world.scale = Math.min(1.15, Math.max(0.85, rect.width / 420));
          world.touchZoneH = clamp(104 * world.scale, 92, 128);

          paddle.w = clamp(120 * world.scale, 92, 168);
          paddle.h = clamp(14 * world.scale, 12, 18);
          paddle.rx = paddle.h * 0.6;
          paddle.y = world.h - world.touchZoneH - 22 * world.scale;

          ball.r = clamp(8 * world.scale, 7, 11);
          for (const b of balls) b.r = ball.r;
          bricks.top = 64 * world.scale;
          bricks.height = clamp(20 * world.scale, 18, 26);
          bricks.gap = clamp(8 * world.scale, 6, 10);
          bricks.paddingX = clamp(18 * world.scale, 12, 22);

          paddle.x = clamp(paddle.x || world.w / 2, paddle.w / 2 + 8, world.w - paddle.w / 2 - 8);
          paddle.targetX = paddle.x;
          if (balls.some((b) => b.active && b.stuck)) attachBallToPaddle();
        }

        function attachBallToPaddle() {
          for (const b of balls) {
            if (!b.active) continue;
            if (!b.stuck) continue;
            b.x = paddle.x;
            b.y = paddle.y - paddle.h / 2 - b.r - 2;
          }
        }

        function setHud() {
          scoreEl.textContent = `${state.score}`;
          livesEl.textContent = `${state.lives}`;
          levelEl.textContent = `${state.level}`;
        }

        function showOverlay(show) {
          overlay.style.opacity = show ? "1" : "0";
          overlay.style.transition = "opacity 180ms ease";
        }

        function resetBallAndPaddle() {
          paddle.x = world.w / 2;
          paddle.targetX = paddle.x;
          for (const b of balls) {
            b.active = true;
            b.vx = 0;
            b.vy = 0;
            b.spin = 0;
            b.stuck = true;
            b.baseSpeed = ball.baseSpeed;
          }
          state.awaitingRelease = true;
          powerups.drops = [];
          powerups.expandUntil = 0;
          powerups.slowUntil = 0;
          powerups.multiballUntil = 0;
          attachBallToPaddle();
        }

        function buildBricks() {
          bricks.items = [];
          const maxW = world.w - bricks.paddingX * 2;
          const brickW = (maxW - bricks.gap * (bricks.cols - 1)) / bricks.cols;
          const brickH = bricks.height;
          const y0 = bricks.top;
          const palette = [
            "#67d0ff",
            "#83f2c4",
            "#ffd36a",
            "#ff7aa2",
            "#b392ff",
            "#56ffa5",
            "#ff9c5a",
          ];

          for (let r = 0; r < bricks.rows; r++) {
            for (let c = 0; c < bricks.cols; c++) {
              const x = bricks.paddingX + c * (brickW + bricks.gap);
              const y = y0 + r * (brickH + bricks.gap);
              const hp = 1 + Math.floor((state.level - 1 + r) / 4);
              const color = palette[(r + c + state.level) % palette.length];
              bricks.items.push({
                x,
                y,
                w: brickW,
                h: brickH,
                hp,
                color,
                alive: true,
              });
            }
          }
        }

        function startGameIfNeeded() {
          if (!state.running) {
            state.running = true;
            state.paused = false;
            showOverlay(false);
            state.lastTs = performance.now();
            requestAnimationFrame(tick);
          }
        }

        function togglePause() {
          if (!state.running) return;
          state.paused = !state.paused;
          if (!state.paused) {
            state.lastTs = performance.now();
            requestAnimationFrame(tick);
          }
          showOverlay(state.paused);
        }

        function releaseBall() {
          if (!state.running) startGameIfNeeded();
          let released = false;
          for (const b of balls) {
            if (!b.active) continue;
            if (!b.stuck) continue;
            b.stuck = false;
            released = true;
            const speed = b.baseSpeed * (0.82 + 0.04 * Math.min(8, state.level));
            const angle = rand((-Math.PI * 3) / 4, (-Math.PI * 1) / 4);
            b.vx = Math.cos(angle) * speed;
            b.vy = Math.sin(angle) * speed;
          }
          if (released) state.awaitingRelease = false;
        }

        function resetAll() {
          state.running = false;
          state.paused = false;
          state.awaitingRelease = true;
          state.score = 0;
          state.lives = 3;
          state.level = 1;
          setHud();
          resize();
          buildBricks();
          resetBallAndPaddle();
          showOverlay(true);
          draw(performance.now(), 0);
        }

        function nextLevel() {
          state.level += 1;
          setHud();
          buildBricks();
          resetBallAndPaddle();
          showOverlay(true);
        }

        function loseLife() {
          state.lives -= 1;
          setHud();
          if (state.lives <= 0) {
            state.running = false;
            state.paused = false;
            showOverlay(true);
            return;
          }
          resetBallAndPaddle();
          showOverlay(true);
        }

        function remainingBricks() {
          let alive = 0;
          for (const b of bricks.items) if (b.alive) alive++;
          return alive;
        }

        function reflectBallOnPaddle(b) {
          const halfW = paddle.w / 2;
          const left = paddle.x - halfW;
          const right = paddle.x + halfW;
          const top = paddle.y - paddle.h / 2;
          const bottom = paddle.y + paddle.h / 2;

          const nearestX = clamp(b.x, left, right);
          const nearestY = clamp(b.y, top, bottom);
          const dx = b.x - nearestX;
          const dy = b.y - nearestY;
          if (dx * dx + dy * dy > b.r * b.r) return false;

          const hitPos = clamp((b.x - paddle.x) / halfW, -1, 1);
          const speed = Math.hypot(b.vx, b.vy);
          const angle = (-Math.PI / 2) + hitPos * (Math.PI * 0.38);

          const paddleVel = clamp((paddle.x - paddle.targetX) * 10, -600, 600);
          b.spin = clamp(b.spin + paddleVel * 0.0006, -0.35, 0.35);

          const outSpeed = Math.max(300, speed);
          b.vx = Math.cos(angle) * outSpeed + paddleVel * 0.22;
          b.vy = Math.sin(angle) * outSpeed;

          b.y = top - b.r - 0.5;
          return true;
        }

        function hitBrick(b, brick) {
          const nearestX = clamp(b.x, brick.x, brick.x + brick.w);
          const nearestY = clamp(b.y, brick.y, brick.y + brick.h);
          const dx = b.x - nearestX;
          const dy = b.y - nearestY;
          if (dx * dx + dy * dy > b.r * b.r) return false;

          const overlapX = Math.min(Math.abs(b.x - brick.x), Math.abs(b.x - (brick.x + brick.w)));
          const overlapY = Math.min(Math.abs(b.y - brick.y), Math.abs(b.y - (brick.y + brick.h)));

          if (overlapX < overlapY) {
            b.vx *= -1;
          } else {
            b.vy *= -1;
          }

          brick.hp -= 1;
          if (brick.hp <= 0) {
            brick.alive = false;
            state.score += 100;
            maybeSpawnDrop(brick);
          } else {
            state.score += 25;
          }
          setHud();
          return true;
        }

        function nowMs() {
          return performance.now();
        }

        function maybeSpawnDrop(brick) {
          // Roughly 18% chance to drop an item.
          if (Math.random() > 0.18) return;
          const roll = Math.random();
          const type = roll < 0.42 ? "expand" : roll < 0.78 ? "slow" : roll < 0.92 ? "multiball" : "life";
          powerups.drops.push({
            type,
            x: brick.x + brick.w / 2,
            y: brick.y + brick.h / 2,
            vy: 170 * world.scale,
            r: 10 * world.scale,
            alive: true,
          });
        }

        function applyDrop(type) {
          const t = nowMs();
          if (type === "expand") {
            powerups.expandUntil = Math.max(powerups.expandUntil, t + 12000);
          } else if (type === "slow") {
            powerups.slowUntil = Math.max(powerups.slowUntil, t + 9000);
          } else if (type === "multiball") {
            powerups.multiballUntil = Math.max(powerups.multiballUntil, t + 11000);
            spawnExtraBalls(2);
          } else if (type === "life") {
            state.lives += 1;
            setHud();
          }
        }

        function spawnExtraBalls(count) {
          const activeBalls = balls.filter((b) => b.active && !b.stuck);
          const src = activeBalls[0];
          if (!src) return;
          let created = 0;
          for (const b of balls) {
            if (created >= count) break;
            if (b.active && b !== src) continue;
          }
          // Ensure we have at least 3 balls allocated.
          while (balls.length < 3) {
            balls.push({
              x: src.x,
              y: src.y,
              r: src.r,
              vx: 0,
              vy: 0,
              baseSpeed: src.baseSpeed,
              stuck: false,
              spin: 0,
              active: false,
            });
          }
          for (const b of balls) {
            if (created >= count) break;
            if (b === src) continue;
            if (b.active) continue;
            b.active = true;
            b.stuck = false;
            b.r = src.r;
            b.x = src.x;
            b.y = src.y;
            const angle = rand((-Math.PI * 3) / 4, (-Math.PI * 1) / 4) + rand(-0.35, 0.35);
            const speed = Math.max(300, Math.hypot(src.vx, src.vy));
            b.vx = Math.cos(angle) * speed;
            b.vy = Math.sin(angle) * speed;
            b.spin = src.spin * 0.6;
            created++;
          }
        }

        function step(dt) {
          const t = nowMs();

          // Apply active powerups to paddle/ball speed.
          const expandOn = t < powerups.expandUntil;
          const slowOn = t < powerups.slowUntil;

          if (!powerups.originalPaddleW) powerups.originalPaddleW = paddle.w;
          const targetW = clamp((expandOn ? powerups.originalPaddleW * 1.35 : powerups.originalPaddleW) * 1.0, 92, 220);
          paddle.w += (targetW - paddle.w) * (1 - Math.pow(1 - 0.2, dt * 60));

          const follow = 0.26;
          paddle.x += (paddle.targetX - paddle.x) * (1 - Math.pow(1 - follow, dt * 60));
          paddle.x = clamp(paddle.x, paddle.w / 2 + 8, world.w - paddle.w / 2 - 8);

          if (balls.some((b) => b.active && b.stuck)) {
            attachBallToPaddle();
          }

          // Update falling drops.
          for (const d of powerups.drops) {
            if (!d.alive) continue;
            d.y += d.vy * dt;
            const halfW = paddle.w / 2;
            const left = paddle.x - halfW;
            const right = paddle.x + halfW;
            const top = paddle.y - paddle.h / 2;
            const bottom = paddle.y + paddle.h / 2;
            const hitX = clamp(d.x, left, right);
            const hitY = clamp(d.y, top, bottom);
            const dx = d.x - hitX;
            const dy = d.y - hitY;
            if (dx * dx + dy * dy <= d.r * d.r) {
              d.alive = false;
              applyDrop(d.type);
            } else if (d.y - d.r > world.h + 30) {
              d.alive = false;
            }
          }

          let anyBallMoving = false;
          let lostAny = false;
          for (const b of balls) {
            if (!b.active) continue;
            if (b.stuck) continue;
            anyBallMoving = true;

            const speed = Math.hypot(b.vx, b.vy);
            const spinCurve = clamp(b.spin, -0.35, 0.35);
            const curved = spinCurve * 0.75;
            const nx = b.vx / (speed || 1);
            const ny = b.vy / (speed || 1);
            const cx = -ny * curved;
            const cy = nx * curved;

            const slowMul = slowOn ? 0.72 : 1;
            b.vx += cx * dt * 180;
            b.vy += cy * dt * 180;

            b.x += b.vx * dt * slowMul;
            b.y += b.vy * dt * slowMul;

            if (b.x - b.r < 0) {
              b.x = b.r;
              b.vx = Math.abs(b.vx);
            } else if (b.x + b.r > world.w) {
              b.x = world.w - b.r;
              b.vx = -Math.abs(b.vx);
            }

            if (b.y - b.r < 0) {
              b.y = b.r;
              b.vy = Math.abs(b.vy);
            }

            reflectBallOnPaddle(b);

            for (const br of bricks.items) {
              if (!br.alive) continue;
              if (hitBrick(b, br)) break;
            }

            if (b.y - b.r > world.h + 40) {
              b.active = false;
              lostAny = true;
            }
          }

          // If all balls are lost, lose a life.
          if (lostAny && !anyBallMoving && balls.every((b) => !b.active || b.stuck)) loseLife();

          // Keep at least one ball allocated & active when awaiting release.
          if (!balls.some((b) => b.active)) {
            balls[0].active = true;
            balls[0].stuck = true;
          }

          if (remainingBricks() === 0) nextLevel();
        }

        function draw(ts, dt) {
          ctx.clearRect(0, 0, world.w, world.h);

          const bgGrad = ctx.createLinearGradient(0, 0, 0, world.h);
          bgGrad.addColorStop(0, "rgba(255,255,255,0.02)");
          bgGrad.addColorStop(1, "rgba(255,255,255,0.00)");
          ctx.fillStyle = bgGrad;
          ctx.fillRect(0, 0, world.w, world.h);

          // Touch zone (below paddle) to keep finger away from playfield
          ctx.save();
          const tzY = world.h - world.touchZoneH;
          const tzGrad = ctx.createLinearGradient(0, tzY, 0, world.h);
          tzGrad.addColorStop(0, "rgba(255,255,255,0.02)");
          tzGrad.addColorStop(1, "rgba(0,0,0,0.22)");
          ctx.fillStyle = tzGrad;
          ctx.fillRect(0, tzY, world.w, world.touchZoneH);
          ctx.strokeStyle = "rgba(255,255,255,0.10)";
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.moveTo(0, tzY + 0.5);
          ctx.lineTo(world.w, tzY + 0.5);
          ctx.stroke();
          ctx.restore();

          // Ball glows
          for (const b of balls) {
            if (!b.active) continue;
            const glow = ctx.createRadialGradient(b.x, b.y, 0, b.x, b.y, b.r * 7);
            glow.addColorStop(0, "rgba(103,208,255,0.26)");
            glow.addColorStop(1, "rgba(103,208,255,0.00)");
            ctx.fillStyle = glow;
            ctx.beginPath();
            ctx.arc(b.x, b.y, b.r * 7, 0, Math.PI * 2);
            ctx.fill();
          }

          for (const b of bricks.items) {
            if (!b.alive) continue;
            ctx.save();
            const alpha = 0.88;
            ctx.globalAlpha = alpha;
            ctx.fillStyle = b.color;
            roundRect(ctx, b.x, b.y, b.w, b.h, 8 * world.scale);
            ctx.fill();
            ctx.globalAlpha = 0.14;
            ctx.fillStyle = "white";
            roundRect(ctx, b.x + 1.5, b.y + 1.5, b.w - 3, b.h * 0.42, 7 * world.scale);
            ctx.fill();
            if (b.hp > 1) {
              ctx.globalAlpha = 0.75;
              ctx.fillStyle = "rgba(0,0,0,0.25)";
              ctx.font = `${Math.floor(12 * world.scale)}px system-ui, -apple-system, sans-serif`;
              ctx.textAlign = "center";
              ctx.textBaseline = "middle";
              ctx.fillText(`${b.hp}`, b.x + b.w / 2, b.y + b.h / 2);
            }
            ctx.restore();
          }

          ctx.save();
          const shadowY = paddle.y + paddle.h / 2 + 8;
          const shadowGrad = ctx.createRadialGradient(paddle.x, shadowY, 4, paddle.x, shadowY, paddle.w * 0.7);
          shadowGrad.addColorStop(0, "rgba(0,0,0,0.45)");
          shadowGrad.addColorStop(1, "rgba(0,0,0,0.0)");
          ctx.fillStyle = shadowGrad;
          ctx.beginPath();
          ctx.ellipse(paddle.x, shadowY, paddle.w * 0.62, paddle.h * 0.95, 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();

          ctx.save();
          const pGrad = ctx.createLinearGradient(0, paddle.y - paddle.h / 2, 0, paddle.y + paddle.h / 2);
          pGrad.addColorStop(0, "rgba(255,255,255,0.85)");
          pGrad.addColorStop(1, "rgba(103,208,255,0.65)");
          ctx.fillStyle = pGrad;
          roundRect(ctx, paddle.x - paddle.w / 2, paddle.y - paddle.h / 2, paddle.w, paddle.h, paddle.rx);
          ctx.fill();
          ctx.globalAlpha = 0.25;
          ctx.fillStyle = "white";
          roundRect(
            ctx,
            paddle.x - paddle.w / 2 + 2,
            paddle.y - paddle.h / 2 + 2,
            paddle.w - 4,
            paddle.h * 0.45,
            paddle.rx - 2,
          );
          ctx.fill();
          ctx.restore();

          // Drops
          ctx.save();
          for (const d of powerups.drops) {
            if (!d.alive) continue;
            const color =
              d.type === "expand"
                ? "#83f2c4"
                : d.type === "slow"
                  ? "#67d0ff"
                  : d.type === "multiball"
                    ? "#b392ff"
                    : "#ffd36a";
            ctx.globalAlpha = 0.92;
            ctx.fillStyle = color;
            ctx.beginPath();
            ctx.arc(d.x, d.y, d.r, 0, Math.PI * 2);
            ctx.fill();
            ctx.globalAlpha = 0.22;
            ctx.fillStyle = "white";
            ctx.beginPath();
            ctx.arc(d.x - d.r * 0.25, d.y - d.r * 0.35, d.r * 0.6, 0, Math.PI * 2);
            ctx.fill();
          }
          ctx.restore();

          // Balls
          for (const b of balls) {
            if (!b.active) continue;
            ctx.save();
            ctx.fillStyle = "white";
            ctx.beginPath();
            ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
            ctx.fill();
            ctx.globalAlpha = 0.25;
            ctx.fillStyle = "#67d0ff";
            ctx.beginPath();
            ctx.arc(b.x - b.r * 0.25, b.y - b.r * 0.35, b.r * 0.6, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
          }

          // Active effect label
          const t = nowMs();
          const labels = [];
          if (t < powerups.expandUntil) labels.push("EXPAND");
          if (t < powerups.slowUntil) labels.push("SLOW");
          if (t < powerups.multiballUntil) labels.push("MULTI");
          if (labels.length) {
            ctx.save();
            ctx.globalAlpha = 0.92;
            ctx.fillStyle = "rgba(0,0,0,0.32)";
            ctx.strokeStyle = "rgba(255,255,255,0.16)";
            ctx.lineWidth = 1;
            roundRect(ctx, world.w - 12 - 110, 14, 110, 32, 12);
            ctx.fill();
            ctx.stroke();
            ctx.fillStyle = "rgba(255,255,255,0.92)";
            ctx.font = `700 ${Math.floor(12 * world.scale)}px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace`;
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.fillText(labels.join(" "), world.w - 12 - 55, 30);
            ctx.restore();
          }

          if (!state.running || state.paused || state.awaitingRelease) {
            ctx.save();
            ctx.globalAlpha = 0.9;
            ctx.fillStyle = "rgba(255,255,255,0.12)";
            ctx.strokeStyle = "rgba(255,255,255,0.18)";
            ctx.lineWidth = 1;
            roundRect(ctx, 14, 14, 210, 44, 14);
            ctx.fill();
            ctx.stroke();
            ctx.fillStyle = "rgba(255,255,255,0.9)";
            ctx.font = `600 ${Math.floor(12 * world.scale)}px system-ui, -apple-system, sans-serif`;
            ctx.textBaseline = "middle";
            ctx.fillText(state.paused ? "一時停止中（タップで再開）" : "タップで開始 / リリース", 26, 36);
            ctx.restore();
          }
        }

        function tick(ts) {
          if (!state.running || state.paused) return;
          const dt = clamp((ts - state.lastTs) / 1000, 0, 1 / 20);
          state.lastTs = ts;
          step(dt);
          draw(ts, dt);
          requestAnimationFrame(tick);
        }

        function roundRect(c, x, y, w, h, r) {
          const rr = clamp(r, 0, Math.min(w, h) / 2);
          c.beginPath();
          c.moveTo(x + rr, y);
          c.arcTo(x + w, y, x + w, y + h, rr);
          c.arcTo(x + w, y + h, x, y + h, rr);
          c.arcTo(x, y + h, x, y, rr);
          c.arcTo(x, y, x + w, y, rr);
          c.closePath();
        }

        function pointerToX(evt) {
          const rect = canvas.getBoundingClientRect();
          const x = (evt.clientX - rect.left) * (world.w / rect.width);
          return clamp(x, 0, world.w);
        }

        function pointerIsInTouchZone(evt) {
          const rect = canvas.getBoundingClientRect();
          const y = (evt.clientY - rect.top) * (world.h / rect.height);
          return y >= world.h - world.touchZoneH - 8;
        }

        function onPointerDown(evt) {
          if (evt.pointerType === "mouse" && evt.button !== 0) return;
          canvas.setPointerCapture(evt.pointerId);
          state.activePointerId = evt.pointerId;
          state.pointerDown = true;
          state.pointerX = pointerToX(evt);
          state.pointerDownX = evt.clientX;
          state.pointerDownY = evt.clientY;
          state.pointerDownAt = performance.now();
          state.pointerMoved = false;
          state.pointerStartedInTouchZone = pointerIsInTouchZone(evt);
          paddle.targetX = state.pointerX;
          showOverlay(false);
        }

        function onPointerMove(evt) {
          if (!state.pointerDown) return;
          if (state.activePointerId !== evt.pointerId) return;
          state.pointerX = pointerToX(evt);
          paddle.targetX = state.pointerX;
          const dx = evt.clientX - state.pointerDownX;
          const dy = evt.clientY - state.pointerDownY;
          if (dx * dx + dy * dy > 12 * 12) state.pointerMoved = true;
        }

        function onPointerUp(evt) {
          if (state.activePointerId !== evt.pointerId) return;
          state.pointerDown = false;
          state.activePointerId = null;
          const elapsed = performance.now() - state.pointerDownAt;
          if (state.pointerStartedInTouchZone && !state.pointerMoved && elapsed < 280) onTapAction();
        }

        function onTapAction() {
          if (state.paused) {
            togglePause();
            return;
          }
          startGameIfNeeded();
          if (balls.some((b) => b.active && b.stuck)) releaseBall();
        }

        let lastTouchEnd = 0;
        function onTouchEnd(evt) {
          const now = performance.now();
          if (now - lastTouchEnd < 320) evt.preventDefault();
          lastTouchEnd = now;
        }

        function onTouchStart(evt) {
          if (evt.touches && evt.touches.length >= 2) {
            state.twoFingerTapArmed = true;
            setTimeout(() => {
              state.twoFingerTapArmed = false;
            }, 250);
          }
        }

        function onTouchCancel() {
          state.twoFingerTapArmed = false;
        }

        function onTouchEndDetectPause(evt) {
          if (state.twoFingerTapArmed) {
            state.twoFingerTapArmed = false;
            togglePause();
            evt.preventDefault();
          }
        }

        btnStart.addEventListener("click", () => onTapAction(), { passive: true });
        btnPause.addEventListener("click", () => togglePause(), { passive: true });
        btnReset.addEventListener("click", () => resetAll(), { passive: true });

        canvas.addEventListener("pointerdown", onPointerDown, { passive: false });
        canvas.addEventListener("pointermove", onPointerMove, { passive: false });
        canvas.addEventListener("pointerup", onPointerUp, { passive: true });
        canvas.addEventListener("pointercancel", onPointerUp, { passive: true });

        canvas.addEventListener("touchstart", onTouchStart, { passive: false });
        canvas.addEventListener("touchend", onTouchEndDetectPause, { passive: false });
        canvas.addEventListener("touchcancel", onTouchCancel, { passive: true });
        document.addEventListener("touchend", onTouchEnd, { passive: false });

        window.addEventListener("resize", () => {
          resize();
          buildBricks();
          draw(performance.now(), 0);
        });

        setHud();
        resize();
        buildBricks();
        resetBallAndPaddle();
        showOverlay(true);
        draw(performance.now(), 0);
      })();
    </script>
  </body>
</html>
